name: Auto Merge Dev

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'dev' &&
      contains(fromJson('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for trusted team PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null' | grep -q true; then
            echo "Auto-merge is already enabled."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
